<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка — Canvas</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <h1>ЗМЕЙКА</h1>

    <div class="hud">
      <div class="score">СЧЁТ: <span id="score">0</span></div>
      <div class="record">РЕКОРД: <span id="record">0</span></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="400" height="400"></canvas>

      <div class="overlay hidden" id="overlay">
        <h2>ИГРА ОКОНЧЕНА</h2>
        <p>Ваш счёт: <span id="finalScore">0</span></p>
        <button id="restartBtn" class="btn">НАЧАТЬ ЗАНОВО</button>
      </div>
    </div>

    <div class="hint">Управление: <span class="key">▲</span> <span class="key">◄</span> <span class="key">▼</span> <span class="key">►</span></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
